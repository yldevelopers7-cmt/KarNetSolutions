<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#02070c" />
<title>Thank You | KarNet Broadband</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#03080d;color:#f4f7f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{min-height:100svh;display:grid;place-items:center;padding:28px;background:
    radial-gradient(circle at 11% 9%,rgba(22,211,190,.08),transparent 28%),
    radial-gradient(circle at 86% 83%,rgba(13,148,136,.06),transparent 28%),#03080d}
  .card{width:min(1220px,100%);border:1px solid rgba(32,211,190,.22);border-radius:28px;padding:34px;position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(12,25,32,.82),rgba(3,8,13,.94));box-shadow:0 30px 90px rgba(0,0,0,.45)}
  .card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 0%,rgba(33,229,204,.08),transparent 25%)}
  .brand{height:48px;width:auto;max-width:180px;object-fit:contain;display:block;margin-bottom:34px}
  .eyebrow{font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:#22d3c5;margin-bottom:16px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,5.2vw,76px);line-height:1.04;letter-spacing:-.035em;margin:0;max-width:1100px;color:#fff}
  p{font-size:clamp(15px,1.5vw,19px);line-height:1.7;color:#a8b6bd;margin:22px 0 0;max-width:1000px}
  .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 25px;border-radius:999px;text-decoration:none;font-weight:750;font-size:15px;transition:.2s ease}
  .primary{background:#20d4c4;color:#03100f;box-shadow:0 10px 32px rgba(32,212,196,.18)} .primary:hover{transform:translateY(-1px);background:#35dfd0}
  .secondary{color:#f3f6f7;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.035)} .secondary:hover{border-color:rgba(32,212,196,.45)}
  .status{margin-top:30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#71848e;letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:640px){body{padding:16px}.card{padding:26px 22px;border-radius:22px}.brand{height:40px;margin-bottom:28px}.actions{display:grid;grid-template-columns:1fr}.actions a{width:100%}}
</style>
</head>
<body>
  <main class="card">
    <img src="assets/karnet-broadband-logo.jpg" alt="KarNet Broadband" class="brand" />
    <div class="eyebrow" id="statusLabel">ENQUIRY SUBMITTED</div>
    <h1 id="heading">Thank you for contacting KarNet Broadband.</h1>
    <p id="message">Your requirement has been sent to our team. We will review your details and get back to you using the contact information you shared.</p>
    <div class="actions">
      <a class="primary" href="./">Back to Website</a>
      <a class="secondary" href="tel:+918317410521">Call Now</a>
    </div>
    <div class="status">KarNet Broadband · Request received successfully</div>
  </main>
<script>
  const type=new URLSearchParams(location.search).get('type')||'enquiry';
  const copy={
    message:{label:'MESSAGE SUBMITTED',heading:'Thank you for contacting KarNet Broadband.',message:'Your message has been sent to our team. We will review it and get back to you using the contact information you shared.'},
    enquiry:{label:'ENQUIRY SUBMITTED',heading:'Thank you for contacting KarNet Broadband.',message:'Your enquiry has been sent to our team. We will review your requirement and get back to you using the contact information you shared.'},
    demo:{label:'DEMO REQUEST SUBMITTED',heading:'Your KarNet Broadband demo request is received.',message:'Our team has received your demo request and will contact you to arrange the next steps.'},
    broadband:{label:'BROADBAND REQUEST SUBMITTED',heading:'Your KarNet Broadband request is received.',message:'Our broadband team has received your requirement and will contact you after reviewing the location and service details you submitted.'}
  }[type]||null;
  if(copy){document.getElementById('statusLabel').textContent=copy.label;document.getElementById('heading').textContent=copy.heading;document.getElementById('message').textContent=copy.message;}
</script>
</body>
</html>
